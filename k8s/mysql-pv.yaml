# mysql-pv.yaml (Extra 3)
# PersistentVolume: 1Gi of storage on the minikube node (hostPath).
# minikube keeps /data across restarts. Retain = data survives PVC deletion.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/devops-mysql
    type: DirectoryOrCreate
