# deployment.yaml - runs the REST API image pushed to Docker Hub
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-python
  labels:
    app: hello-python
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: hello-python
  template:
    metadata:
      labels:
        app: hello-python
    spec:
      containers:
        - name: hello-python
          image: {{ .Values.image.repository | quote }}
          ports:
            - containerPort: 5000   # Flask app port
          envFrom:
            # DB_HOST / DB_PORT (Extra 2: ConfigMap)
            - configMapRef:
                name: db-config
            # DB_USER / DB_PASSWORD (Extra 1: Secret, created by the pipeline)
            - secretRef:
                name: db-secret
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 3
